<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Label Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js"></script>
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#8b93a5;
  --ok:#2fbf71; --warn:#e0a92b; --bad:#e5534b; --accent:#4c8dff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
#status{font-size:12px;color:var(--muted);text-align:right}
#cam{position:relative;width:100%;height:50vh;background:#000;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#guide{position:absolute;left:5%;width:90%;top:20%;height:60%;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);transition:border-color .15s, box-shadow .15s}
#guide.hit{border-color:var(--warn)}
#guide.locked{border-color:var(--ok);box-shadow:0 0 0 9999px rgba(20,90,50,.55)}
#guide.dup{border-color:var(--accent);box-shadow:0 0 0 9999px rgba(30,50,110,.55)}
#flash{position:absolute;left:0;right:0;top:40%;text-align:center;font:700 22px system-ui;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;transition:opacity .2s}
#flash.show{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 3px #000;padding:0 10px}
#camBtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
#rates{position:absolute;top:10px;left:10px;font:11px ui-monospace,Consolas,monospace;color:#fff;text-shadow:0 1px 2px #000}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5}
main{padding:12px 14px 40px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.card.done{border-color:rgba(47,191,113,.5)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.val{font:600 18px/1.3 ui-monospace,Consolas,monospace;word-break:break-all}
.val.small{font-size:13px;font-weight:400}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.card.done .bar i{background:var(--ok)}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cand{font:12px ui-monospace,Consolas,monospace;padding:3px 7px;border-radius:6px;border:1px dashed var(--line);color:var(--muted);background:transparent}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.note.ok{color:var(--ok)}
.note.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.settings{font-size:13px;color:var(--muted);display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:8px 0}
.settings label{display:flex;align-items:center;gap:6px}
.settings input[type=number]{width:56px;font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.mono{font-family:ui-monospace,Consolas,monospace}
td .del{padding:2px 8px;font-size:12px}
.src{font-size:11px;color:var(--muted)}
details{margin-top:10px}
summary{color:var(--muted);font-size:13px;cursor:pointer}
pre{white-space:pre-wrap;font-size:11px;color:var(--muted);background:var(--panel);padding:8px;border-radius:8px;max-height:180px;overflow:auto}
#preview{max-width:100%;border-radius:6px;margin-top:6px;border:1px solid var(--line)}
h2{font-size:14px;margin:18px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body>
<header>
  <h1>Label Scanner</h1>
  <span id="status">Loading…</span>
</header>

<div id="cam">
  <video id="video" playsinline muted autoplay></video>
  <div id="guide"></div>
  <div id="flash"></div>
  <div id="rates"></div>
  <div id="camBtns"><button id="torchBtn" hidden>Light</button></div>
  <div id="hint">Sweep over the label — the 2D code locks in one sharp frame; text OCR fills in otherwise</div>
</div>

<main>
  <div class="row">
    <button id="startBtn" class="primary" disabled>Start camera</button>
    <button id="pauseBtn" disabled>Pause</button>
    <button id="resetBtn">Clear current</button>
  </div>

  <div class="card" id="dmCard">
    <div class="top"><span class="name">2D barcode</span><span class="badge" id="dmBadge">searching</span></div>
    <div class="val small" id="dmVal">—</div>
  </div>
  <div id="fields"></div>

  <details>
    <summary>Settings</summary>
    <div class="settings">
      <label><input type="checkbox" id="reqSN" checked> Require serial</label>
      <label><input type="checkbox" id="reqPN" checked> Require part #</label>
      <label><input type="checkbox" id="reqMAC"> Require MAC</label>
      <label><input type="checkbox" id="autoNext" checked> Auto-save &amp; continue</label>
      <label><input type="checkbox" id="useOCR" checked> Text OCR</label>
      <label><input type="checkbox" id="useDM" checked> 2D barcode</label>
      <label>OCR matching reads <input type="number" id="need" min="2" max="8" value="3"></label>
      <label>Serial length <input type="number" id="snLen" min="6" max="16" value="10"></label>
    </div>
  </details>

  <details>
    <summary>Debug: last OCR frame</summary>
    <canvas id="preview"></canvas>
    <pre id="raw">(nothing yet)</pre>
  </details>

  <h2>Saved scans <span id="count"></span></h2>
  <div class="row">
    <button id="csvBtn">Export CSV</button>
    <button id="clearBtn">Clear list</button>
  </div>
  <table>
    <thead><tr><th>Serial</th><th>Part #</th><th>Model / MAC</th><th></th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</main>

<script>
(() => {
'use strict';

// ---------- Known part numbers (base, without #option). Extend as needed. ----------
const KNOWN_PN = {
  '5TW13AA': 'HP USB-C/A Universal Dock G2',
  '5TW13UT': 'HP USB-C/A Universal Dock G2',
  'BB3Q4UT': 'HP ProBook 4 G11 16'
};

const FIELDS = [
  { key: 'sn',    label: 'Serial' },
  { key: 'pn',    label: 'Part # / ProdID' },
  { key: 'mac',   label: 'MAC' },
  { key: 'model', label: 'Model text' }
];
const OCR_WORKERS = 2;

const $ = id => document.getElementById(id);
const video = $('video'), guide = $('guide'), statusEl = $('status');

let scheduler = null, ocrReady = false, dmReady = false;
let stream = null, track = null, running = false;
let cur;                                  // current label state
let records = loadRecords();
let lastDupSn = null;
const stats = { dm: [], ocr: [] };        // timestamps for rate display

// ---------- Startup ----------
async function initOCR() {
  scheduler = Tesseract.createScheduler();
  for (let i = 0; i < OCR_WORKERS; i++) {
    const w = await Tesseract.createWorker('eng', 1);
    await w.setParameters({
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789:/#-. ',
      tessedit_pageseg_mode: '11',
      preserve_interword_spaces: '1'
    });
    scheduler.addWorker(w);
  }
  ocrReady = true;
}
async function initDM() {
  if (!window.ZXingWASM) throw new Error('barcode library not loaded');
  // Warm up the wasm so the first real frame isn't slow
  await ZXingWASM.readBarcodes(new ImageData(8, 8), { formats: ['DataMatrix'] });
  dmReady = true;
}
function setReadyStatus() {
  const parts = [];
  parts.push(dmReady ? 'barcode ✓' : 'barcode …');
  parts.push(ocrReady ? 'OCR ✓' : 'OCR …');
  statusEl.textContent = parts.join(' · ');
  if (dmReady || ocrReady) $('startBtn').disabled = !!stream;
}

// ---------- Camera ----------
async function startCamera() {
  if (!window.isSecureContext) {
    alert('Camera needs HTTPS (or localhost). Host this page on HTTPS, e.g. GitHub Pages.');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 }, height: { ideal: 1080 },
        frameRate: { ideal: 30 }
      }
    });
  } catch (e) { alert('Could not open camera: ' + e.message); return; }
  video.srcObject = stream;
  await video.play();
  track = stream.getVideoTracks()[0];
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) $('torchBtn').hidden = false;
    const adv = {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) adv.focusMode = 'continuous';
    if (caps.exposureMode && caps.exposureMode.includes('continuous')) adv.exposureMode = 'continuous';
    if (Object.keys(adv).length) await track.applyConstraints({ advanced: [adv] });
  } catch (_) {}
  $('startBtn').textContent = 'Camera on';
  $('startBtn').disabled = true;
  $('pauseBtn').disabled = false;
  running = true;
  dmLoop();
  ocrLoop();
  rateLoop();
}

let torchOn = false;
$('torchBtn').onclick = async () => {
  torchOn = !torchOn;
  try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (_) {}
  $('torchBtn').textContent = torchOn ? 'Light off' : 'Light';
};

// ---------- Geometry: guide box (screen) -> video pixels (object-fit: cover) ----------
function guideInVideo() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const cam = $('cam').getBoundingClientRect(), g = guide.getBoundingClientRect();
  const scale = Math.max(cam.width / vw, cam.height / vh);
  const ox = (cam.width - vw * scale) / 2, oy = (cam.height - vh * scale) / 2;
  let sx = Math.max(0, (g.left - cam.left - ox) / scale);
  let sy = Math.max(0, (g.top - cam.top - oy) / scale);
  const sw = Math.min(vw - sx, g.width / scale), sh = Math.min(vh - sy, g.height / scale);
  return { sx, sy, sw, sh, vw, vh };
}

// ---------- 2D barcode loop (fast path) ----------
const dmCanvas = document.createElement('canvas');
const dmCtx = dmCanvas.getContext('2d', { willReadFrequently: true });
let dmFrame = 0;

async function dmLoop() {
  while (running) {
    if (!dmReady || !$('useDM').checked || cur.done) { await sleep(120); continue; }
    const r = guideInVideo();
    if (!r) { await sleep(60); continue; }
    // Alternate: guide crop at native resolution (small codes) and whole frame downscaled (wide view)
    let src;
    if (dmFrame % 2 === 0) src = { x: r.sx, y: r.sy, w: r.sw, h: r.sh, k: Math.min(1, 1600 / r.sw) };
    else src = { x: 0, y: 0, w: r.vw, h: r.vh, k: Math.min(1, 1280 / Math.max(r.vw, r.vh)) };
    dmCanvas.width = Math.round(src.w * src.k); dmCanvas.height = Math.round(src.h * src.k);
    dmCtx.drawImage(video, src.x, src.y, src.w, src.h, 0, 0, dmCanvas.width, dmCanvas.height);
    const img = dmCtx.getImageData(0, 0, dmCanvas.width, dmCanvas.height);
    try {
      const res = await ZXingWASM.readBarcodes(img, {
        formats: ['DataMatrix', 'QRCode'],
        tryHarder: dmFrame % 6 === 0,      // occasional thorough pass, otherwise fast
        tryRotate: true, tryInvert: true,
        maxNumberOfSymbols: 1
      });
      stats.dm.push(performance.now());
      if (res.length && res[0].isValid) onBarcode(res[0].text, res[0].format);
    } catch (_) {}
    dmFrame++;
    await sleep(15);
  }
}

function parseBarcode(text) {
  const out = {};
  const snLen = +$('snLen').value || 10;
  const toks = text.toUpperCase().split(/[,;|\x1d\x1e\r\n\t ]+/).filter(Boolean);
  for (const t of toks) {
    if (!out.pn && /^[A-Z0-9]{5,8}#[A-Z0-9]{3}$/.test(t)) out.pn = t;
    else if (!out.mac && /^([0-9A-F]{2}[-:]?){5}[0-9A-F]{2}$/.test(t)) out.mac = t.replace(/[-:]/g, '').match(/../g).join('-');
    else if (!out.sn && t.length === snLen && /^[A-Z0-9]+$/.test(t) && /[A-Z]/.test(t) && /\d/.test(t)) out.sn = t;
  }
  // Labeled formats like "S/N:XXXX P/N:YYYY" inside the code
  const labeled = parseText(text);
  for (const k of Object.keys(labeled)) if (!out[k]) out[k] = labeled[k];
  delete out.model;
  return out;
}

function onBarcode(text, format) {
  cur.dmRaw = text; cur.dmFormat = format;
  const found = parseBarcode(text);
  let any = false;
  for (const [k, v] of Object.entries(found)) {
    const L = cur.locked[k];
    if (L && L.source === 'barcode') continue;
    if (L && L.value !== v) cur.conflicts[k] = L.value;   // OCR/manual disagreed with barcode
    cur.locked[k] = { value: v, source: 'barcode' };
    any = true;
  }
  if (any || !cur.dmSeen) { cur.dmSeen = true; render(); }
  if (allDone()) onComplete();
}

// ---------- OCR loop (fallback + cross-check) ----------
let inFlight = 0, ocrFrame = 0;
const sharpHist = [];

async function ocrLoop() {
  while (running) {
    if (!ocrReady || !$('useOCR').checked || cur.done || inFlight >= OCR_WORKERS) { await sleep(60); continue; }
    const f = grabOcrFrame();
    if (!f) { await sleep(60); continue; }
    // Skip blurry frames: compare to the sharpest of the last ~2 seconds
    sharpHist.push(f.sharp); if (sharpHist.length > 20) sharpHist.shift();
    const best = Math.max(...sharpHist);
    if (f.sharp < best * 0.7 && sharpHist.length > 4) { await sleep(40); continue; }
    inFlight++;
    const myLabel = cur.id;
    scheduler.addJob('recognize', f.canvas).then(({ data }) => {
      stats.ocr.push(performance.now());
      if (myLabel !== cur.id || cur.done) return;
      const found = data.confidence >= 40 ? parseText(data.text) : {};
      showDebug(f.canvas, data);
      guide.classList.toggle('hit', Object.keys(found).length > 0);
      addOcrReadings(found);
      render();
      if (allDone()) onComplete();
    }).catch(() => {}).finally(() => { inFlight--; });
    ocrFrame++;
    await sleep(40);
  }
}

function grabOcrFrame() {
  const r = guideInVideo();
  if (!r) return null;
  const targetW = Math.min(1200, Math.max(800, r.sw * 1.3));
  const k = targetW / r.sw;
  const c = document.createElement('canvas');
  c.width = Math.round(r.sw * k); c.height = Math.round(r.sh * k);
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, c.width, c.height);

  const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data, W = c.width;
  const hist = new Uint32Array(256), n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) {
    const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
    d[i] = v; hist[v]++;
  }
  // Sharpness: mean horizontal+vertical gradient on a sparse sample
  let g = 0, cnt = 0;
  for (let y = 2; y < c.height - 2; y += 3) for (let x = 2; x < W - 2; x += 3) {
    const i = (y * W + x) * 4;
    g += Math.abs(d[i] - d[i + 4]) + Math.abs(d[i] - d[i + W * 4]); cnt++;
  }
  const pct = p => { let s = 0; for (let v = 0; v < 256; v++) { s += hist[v]; if (s >= n * p) return v; } return 255; };
  const lo = pct(0.02), hi = pct(0.98), med = pct(0.5);
  const invert = med < (lo + hi) / 2;     // light text on dark label -> invert to dark-on-light
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < d.length; i += 4) {
    let v = (d[i] - lo) * 255 / span;
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    if (invert) v = 255 - v;
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx.putImageData(img, 0, 0);
  return { canvas: c, sharp: g / Math.max(1, cnt) / span };
}

// ---------- Text parsing + format validation ----------
function parseText(text) {
  const t = text.toUpperCase().replace(/[|\\]/g, '/');
  const out = {};
  const snLen = +$('snLen').value || 10;

  // Serial: "S/N", "SN#", "SN:", "SERIAL NO" (OCR may read S/N as SIN, S1N)
  const sn = /\b(?:S\s*[\/I1L]?\s*N|SERIAL(?:\s*N[O0])?)\s*[#:;.,]?\s*([A-Z0-9]{6,16})\b/.exec(t);
  if (sn && sn[1].length === snLen && /[A-Z]/.test(sn[1]) && /\d/.test(sn[1])) out.sn = sn[1];

  // Part #: "P/N", "PRODID", "PROD ID", "PRODUCT NO", "PID"  e.g. 5TW13AA#ABA, BB3Q4UT#ABA
  const PNL = '(?:P\\s*[\\/I1L]?\\s*N|PR[O0]D\\s*[I1L][D0O]|PR[O0]DUCT(?:\\s*(?:N[O0]|NUMBER|[I1L]D))?|P[I1L]D)';
  const pn = new RegExp('\\b' + PNL + '\\s*[#:;.,]?\\s*([A-Z0-9]{5,8}?)\\s*[#H4]?\\s*([A-Z0-9]{3})\\b').exec(t)
          || new RegExp('\\b' + PNL + '\\s*[#:;.,]?\\s*([A-Z0-9]{5,8})\\b').exec(t);
  if (pn && /[A-Z]/.test(pn[1]) && /\d/.test(pn[1])) out.pn = pn[2] ? pn[1] + '#' + pn[2] : pn[1];

  // MAC: six hex pairs; O read for 0 is corrected
  const mac = /\bMAC\s*[:;.]?\s*((?:[0-9A-FO]{2}\s*[-:.]?\s*){5}[0-9A-FO]{2})/.exec(t)
           || /\b((?:[0-9A-F]{2}[-:]){5}[0-9A-F]{2})\b/.exec(t);
  if (mac) {
    const hex = mac[1].replace(/O/g, '0').replace(/[^0-9A-F]/g, '');
    if (hex.length === 12) out.mac = hex.match(/../g).join('-');
  }

  // Model line, e.g. "HP PROBOOK 4 G11 16" / "HP USB-C/A UNIVERSAL DOCK G2"
  const model = /\bHP\s+[A-Z0-9][A-Z0-9 \/\-]{4,40}/.exec(t);
  if (model) out.model = model[0].replace(/\s+/g, ' ').trim();
  return out;
}

// ---------- Consensus + state ----------
let labelSeq = 0;
function resetCurrent() {
  cur = { id: ++labelSeq, tallies: {}, locked: {}, conflicts: {}, dmRaw: null, dmSeen: false, done: false };
  FIELDS.forEach(f => { cur.tallies[f.key] = new Map(); cur.locked[f.key] = null; });
  sharpHist.length = 0;
  guide.classList.remove('locked', 'hit', 'dup');
  render();
}

function addOcrReadings(found) {
  const need = +$('need').value || 3;
  for (const [k, v] of Object.entries(found)) {
    const m = cur.tallies[k];
    m.set(v, (m.get(v) || 0) + 1);
    if (cur.locked[k]) continue;
    const ranked = [...m.entries()].sort((a, b) => b[1] - a[1]);
    const [best, c1] = ranked[0], c2 = ranked[1] ? ranked[1][1] : 0;
    if (c1 >= need && c1 >= c2 * 2) cur.locked[k] = { value: best, source: 'ocr' };
  }
}

function required() {
  const r = [];
  if ($('reqSN').checked) r.push('sn');
  if ($('reqPN').checked) r.push('pn');
  if ($('reqMAC').checked) r.push('mac');
  return r;
}
function allDone() { return required().every(k => cur.locked[k]); }

function onComplete() {
  if (cur.done) return;
  cur.done = true;
  render();
  if (!$('autoNext').checked) {
    guide.classList.add('locked');
    showFlash('Verified — tap box to save');
    alertUser(true);
    return;
  }
  const saved = saveCurrent();
  if (saved) {
    guide.classList.add('locked');
    showFlash('✔ ' + (cur.locked.sn ? cur.locked.sn.value : 'Saved'));
    alertUser(true);
    lastDupSn = null;
  } else {
    guide.classList.add('dup');
    const sn = cur.locked.sn && cur.locked.sn.value;
    showFlash('Already scanned');
    if (sn !== lastDupSn) alertUser(false);   // only buzz once while parked on the same label
    lastDupSn = sn;
  }
  setTimeout(resetCurrent, 900);
}

// ---------- Rendering ----------
function render() {
  // Barcode card
  const dmCard = $('dmCard'), dmBadge = $('dmBadge');
  if (cur.dmRaw) {
    $('dmVal').textContent = cur.dmRaw;
    dmBadge.textContent = 'decoded ✓'; dmBadge.className = 'badge ok'; dmCard.classList.add('done');
  } else {
    $('dmVal').textContent = $('useDM').checked ? 'Point at the square code next to the serial' : 'off';
    dmBadge.textContent = 'searching'; dmBadge.className = 'badge'; dmCard.classList.remove('done');
  }

  const need = +$('need').value || 3;
  const req = required();
  const box = $('fields');
  box.innerHTML = '';
  for (const f of FIELDS) {
    const m = cur.tallies[f.key], L = cur.locked[f.key];
    const ranked = [...m.entries()].sort((a, b) => b[1] - a[1]);
    const top = ranked[0];
    const el = document.createElement('div');
    el.className = 'card' + (L ? ' done' : '');
    const label = L ? { barcode: 'From barcode', ocr: 'OCR verified', manual: 'Picked' }[L.source] : null;
    const badge = L
      ? `<span class="badge ok">${label}</span>`
      : `<span class="badge ${top ? 'warn' : ''}">${top ? top[1] + '/' + need + ' reads' : (req.includes(f.key) ? 'required' : 'optional')}</span>`;
    const pct = L ? 100 : top ? Math.min(100, top[1] / need * 100) : 0;
    el.innerHTML = `
      <div class="top"><span class="name">${f.label}</span>${badge}</div>
      <div class="val">${esc(L ? L.value : top ? top[0] : '—')}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;

    // Cross-check notes
    const notes = [];
    if (L && L.source === 'barcode' && top) {
      if (top[0] === L.value) notes.push(['ok', 'OCR text agrees with barcode']);
      else notes.push(['bad', `OCR read ${top[0]} — barcode value used`]);
    }
    if (cur.conflicts[f.key]) notes.push(['bad', `Earlier pick ${cur.conflicts[f.key]} replaced by barcode`]);
    if (f.key === 'pn' && L) {
      const base = L.value.split('#')[0];
      if (KNOWN_PN[base]) {
        notes.push(['ok', 'Known part: ' + KNOWN_PN[base]]);
        const model = cur.locked.model?.value || (cur.tallies.model.size ? [...cur.tallies.model.entries()].sort((a, b) => b[1] - a[1])[0][0] : null);
        if (model) {
          const words = KNOWN_PN[base].toUpperCase().match(/[A-Z0-9]{2,}/g) || [];
          const hits = words.filter(w => model.includes(w)).length;
          if (hits < Math.ceil(words.length / 2)) notes.push(['bad', 'Model text doesn’t match the known part — double-check']);
        }
      }
    }
    notes.forEach(([cls, txt]) => {
      const d = document.createElement('div');
      d.className = 'note ' + cls;
      d.textContent = (cls === 'ok' ? '✔ ' : '⚠ ') + txt;
      el.appendChild(d);
    });

    // Tap-to-accept candidates
    if (!L && ranked.length) {
      const cands = document.createElement('div');
      cands.className = 'cands';
      ranked.slice(0, 4).forEach(([v, c]) => {
        const b = document.createElement('button');
        b.className = 'cand';
        b.textContent = `${v} ×${c}`;
        b.onclick = () => { cur.locked[f.key] = { value: v, source: 'manual' }; render(); if (allDone()) onComplete(); };
        cands.appendChild(b);
      });
      el.appendChild(cands);
    }
    box.appendChild(el);
  }
}

function showDebug(c, data) {
  if (!$('preview').closest('details').open) return;
  const p = $('preview');
  p.width = c.width; p.height = c.height;
  p.getContext('2d').drawImage(c, 0, 0);
  $('raw').textContent = `confidence ${Math.round(data.confidence)}\n` + data.text;
}

function rateLoop() {
  const tick = () => {
    if (!running) { $('rates').textContent = 'paused'; return; }
    const now = performance.now();
    for (const k of ['dm', 'ocr']) while (stats[k].length && now - stats[k][0] > 3000) stats[k].shift();
    $('rates').textContent = `barcode ${(stats.dm.length / 3).toFixed(1)}/s · OCR ${(stats.ocr.length / 3).toFixed(1)}/s`;
    setTimeout(tick, 500);
  };
  tick();
}

// ---------- Saved scans ----------
function saveCurrent() {
  const v = k => cur.locked[k] ? cur.locked[k].value : '';
  const sn = v('sn');
  if (sn && records.some(r => r.sn === sn)) { statusEl.textContent = 'Already in list: ' + sn; return false; }
  const base = v('pn').split('#')[0];
  const srcs = new Set(required().map(k => cur.locked[k] && cur.locked[k].source).filter(Boolean));
  records.unshift({
    sn, pn: v('pn'), mac: v('mac'),
    model: KNOWN_PN[base] || v('model'),
    source: [...srcs].sort().join('+'),
    barcode: cur.dmRaw || '',
    at: new Date().toISOString()
  });
  persist(); renderList();
  statusEl.textContent = 'Saved ' + (sn || 'scan') + ' (' + records.length + ' total)';
  return true;
}

function renderList() {
  $('count').textContent = records.length ? '(' + records.length + ')' : '';
  $('list').innerHTML = records.map((r, i) => `
    <tr>
      <td class="mono">${esc(r.sn)}<div class="src">${esc(r.source)}</div></td>
      <td class="mono">${esc(r.pn)}</td>
      <td>${esc(r.model)}${r.mac ? '<div class="src mono">' + esc(r.mac) + '</div>' : ''}</td>
      <td><button class="del" data-i="${i}" title="Remove">×</button></td>
    </tr>`).join('');
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('.del');
  if (!b) return;
  const r = records[+b.dataset.i];
  if (r && confirm('Remove ' + (r.sn || 'this scan') + '?')) { records.splice(+b.dataset.i, 1); persist(); renderList(); }
});

function loadRecords() {
  try { return JSON.parse(localStorage.getItem('labelScanRecords') || '[]'); } catch (_) { return []; }
}
function persist() {
  try { localStorage.setItem('labelScanRecords', JSON.stringify(records)); } catch (_) {}
}

$('csvBtn').onclick = () => {
  const cols = ['SerialNumber', 'PartNumber', 'MAC', 'Model', 'Source', 'BarcodeRaw', 'ScannedAt'];
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = records.map(r => [r.sn, r.pn, r.mac, r.model, r.source, r.barcode, r.at].map(q).join(','));
  const blob = new Blob([cols.join(',') + '\r\n' + rows.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'label-scans-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
};
$('clearBtn').onclick = () => { if (confirm('Clear all saved scans?')) { records = []; persist(); renderList(); } };

// ---------- Controls ----------
$('startBtn').onclick = startCamera;
$('pauseBtn').onclick = () => {
  running = !running;
  $('pauseBtn').textContent = running ? 'Pause' : 'Resume';
  statusEl.textContent = running ? 'Scanning…' : 'Paused';
  if (running) { dmLoop(); ocrLoop(); rateLoop(); }
};
$('resetBtn').onclick = resetCurrent;
['reqSN', 'reqPN', 'reqMAC', 'need', 'snLen', 'useDM', 'useOCR'].forEach(id => $(id).addEventListener('change', render));
guide.addEventListener('click', () => {
  if (cur.done && !$('autoNext').checked) { saveCurrent(); resetCurrent(); }
});

// ---------- Helpers ----------
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
let flashT;
function showFlash(txt) {
  const f = $('flash'); f.textContent = txt; f.classList.add('show');
  clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('show'), 850);
}
let actx;
function alertUser(good) {
  try { navigator.vibrate && navigator.vibrate(good ? [50, 30, 50] : 150); } catch (_) {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = good ? 1250 : 500; g.gain.value = 0.08;
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.12);
  } catch (_) {}
}

resetCurrent();
renderList();
setReadyStatus();
initDM().catch(e => { statusEl.textContent = 'Barcode failed: ' + e.message; }).finally(setReadyStatus);
initOCR().catch(e => { statusEl.textContent = 'OCR failed: ' + e.message; }).finally(setReadyStatus);
})();
</script>
</body>
